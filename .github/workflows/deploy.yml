name: 🚀 Deploy Chinook Music Store

on:
  push:
    branches: [ main ]

jobs:
  test-backend:
    name: 🐍 Tests Backend
    runs-on: ubuntu-latest
    env:
      DB_USER: test
      DB_PASSWORD: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          cd backend
          pip install -r requirements.txt -q
      - name: Correr tests
        run: |
          cd backend
          pytest app/tests/ -v

  test-frontend:
    name: ⚛️ Tests Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependencias
        run: |
          cd frontend
          npm install
      - name: Correr tests
        run: |
          cd frontend
          npm test

  test-etl:
    name: 📊 Tests ETL (DimDate + FactSales)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install pytest pandas pyarrow holidays boto3 -q
      - name: Correr tests
        run: pytest etl/tests/ -v

  deploy-backend:
    name: 🐍 Deploy Backend
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-etl]
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy a EC2 Backend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.BACKEND_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/Parcial_BigData_Corte1
            git pull origin main
            source backend/venv/bin/activate
            pip install -r backend/requirements.txt -q
            sudo systemctl restart chinook-backend
            sleep 3
            sudo systemctl status chinook-backend --no-pager

  deploy-frontend:
    name: ⚛️ Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Deploy a EC2 Frontend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.FRONTEND_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/Parcial_BigData_Corte1/frontend
            git pull origin main
            echo "VITE_API_URL=http://${{ secrets.BACKEND_HOST }}:8000/api" > .env
            npm install -q
            npm run build
            sudo rm -rf /var/www/html/*
            sudo cp -r dist/* /var/www/html/
            sudo chown -R www-data:www-data /var/www/html/
            sudo systemctl restart nginx
            echo "✅ Frontend desplegado!"
