name: ETL Analytics Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'etl/**'
      - 'infra/**'
  pull_request:
    branches: [main]
    paths:
      - 'etl/**'
      - 'infra/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Desplegar scripts a S3 y actualizar Glue Jobs'
        required: true
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  # ── JOB 1: Tests unitarios (sin AWS) ───────────────────────────────────────
  test-etl:
    name: Tests ETL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de test
        run: pip install pytest pandas pyarrow holidays boto3 -q

      - name: Correr pytest
        run: |
          if [ -z "$(find etl/tests -name 'test_*.py' 2>/dev/null)" ]; then
            echo "Sin tests aún — OK"
          else
            pytest etl/tests/ -v
          fi

  # ── JOB 2: Validación de sintaxis Python ───────────────────────────────────
  validate-scripts:
    name: Lint Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar flake8
        run: pip install flake8 -q

      - name: Verificar sintaxis ETL scripts
        run: |
          find etl/ infra/ -name "*.py" | xargs python -m py_compile && echo "Sintaxis OK"
          find etl/ infra/ -name "*.py" | xargs flake8 \
            --max-line-length=120 \
            --ignore=E501,W503,E402,F401,F811 \
            --exclude=etl/tests/ \
            || true

  # ── JOB 3+4: Deploy a S3 + actualizar Glue (solo manual) ──────────────────
  deploy-and-update:
    name: Deploy a AWS
    runs-on: ubuntu-latest
    needs: [test-etl, validate-scripts]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN:     ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION:    ${{ secrets.AWS_REGION }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar boto3
        run: pip install boto3 -q

      - name: Subir scripts a S3 y actualizar Glue Jobs
        run: python infra/deploy_jobs.py
